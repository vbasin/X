[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-analytics"
version = "0.1.0"
description = "ML-driven futures analytics pipeline — feature engineering, model training, and live inference for NQ futures and options"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Vadim Basin"},
]
keywords = ["machine-learning", "futures", "options", "feature-engineering", "timeseries"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=2.0",
    "pandas>=2.1,<3",  # tests/CI pinned to the 2.x line; 3.x changes datetime resolution
    "psycopg[binary,pool]>=3.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "pyarrow>=15.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
platform = [
    "databento>=0.74",
    "databento-dbn>=0.52",
    "numba>=0.60",
    "exchange-calendars>=4.5",
    "PyWavelets>=1.5",
    "structlog>=24.0",
    "zstandard>=0.22",
]
deep-learning = ["tensorflow>=2.16"]
training = [
    "optuna>=3.6",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "xgboost>=2.0",
    "lightgbm>=4.0",
    "hmmlearn>=0.3",
    "shap>=0.45",
]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "gunicorn>=22.0",
    "pydantic>=2.7",
]
agents = [
    "openai>=1.40",
    "anthropic>=0.40",
    "jsonschema>=4.21",
    "oci>=2.130",
    "boto3>=1.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
# GPU execution plane (Phase 23 W9): tree/tabular families + Object-Storage job
# queue (boto3). Installed on the GPU VM by deploy/gpu/bootstrap.sh. CUDA-enabled
# TensorFlow/torch wheels are a deployment concern (see Dockerfile.gpu), not pinned here.
gpu = [
    "ml-analytics[platform,training,agents]",
]
all = ["ml-analytics[platform,deep-learning,training,serving,agents,dev]"]

[project.urls]
Repository = "https://github.com/vbasin/X"

[project.scripts]
vtech-features = "src.features.engine:main"
vtech-demo = "src.demo:main"
vtech-showcase = "src.showcase:main"

# ---------------------------------------------------------------------------
# Setuptools – src layout
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
namespaces = true

[tool.setuptools.package-data]
"src.webui" = ["static/*", "static/vendor/*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["acquisition", "common", "features", "ingestion", "models", "training"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra -q"

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = false
