open_critical_findings:
  - id: track-c-full-session-order-flow-normalization
    severity: CRITICAL
    reviewed: "2026-09-24"
    summary: >
      entry_state.py::_order_flow uses full-request CVD/OFI maxima, so
      es_cvd_*, es_delta_* and es_ofi_cum can depend on later decisions.
      Synthetic prefix invariance demonstrably fails. Prior blanket causal
      assurances are superseded; affected matrices require rebuild/revalidation.
      Independent nq-selective-intraday features exclude this module.
    evidence: docs/research/NQ_SELECTIVE_RESULTS.md
  - id: economic-evaluation-inconsistency
    severity: CRITICAL
    summary: >
      At least 10 divergent trade-economics implementations (the earlier
      count of 4 undercounted): backtest/{engine,cascade_backtest,portfolio_sim,
      weights_score(x2 sub-modes)}, paper/engine, execution/ledger,
      evaluation/_kpi, external_models/{pine_sar_ema,orb,vwap_cross},
      webui/chart_models/interpreter -- plus training/cost_matrix, which puts
      economics into the TRAINING OBJECTIVE rather than post-hoc scoring.
      They disagree on slippage (0 vs 1pt/side vs 2 ticks), contract
      multiplier (1.0 vs 2.0 MNQ vs 20.0 NQ -- a 10x spread rendered in the
      same UI), sharpe_daily (annualized vs not, 15.87x), and sharpe_trade
      (which is a t-statistic in cascade_backtest.py:205, not a Sharpe).
      No headline PnL number in the repo is trustworthy at face value.
    tracking_doc: docs/FUNCTIONAL_COVERAGE.md
  - id: frozen-eval-contract-broken-for-production-objective
    severity: CRITICAL
    summary: >
      data/evaluation/nq-50pt-econ/contract_v1.json's objective_snapshot
      contains only ['note','hold_out_source','primary'] instead of the
      objective. src/evaluation/_kpi.py:34-39 then defaults mae_tolerance=5,
      so contract-scored nq-50pt-econ candidates are priced at a 5-point stop
      instead of the declared 6-point stop. Separately the hold_out hash is
      never actually checked: contract.score() only enforces it when
      data_hash is not None, and controller._record_all never passes it.
    tracking_doc: docs/FUNCTIONAL_COVERAGE.md
  - id: no-run-records-seed-or-code-revision
    severity: HIGH
    summary: >
      repro.set_global_seed is called only from the three legacy trainers;
      zero calls from src/search, src/models, src/evaluation. The production
      tabular plugins pass no random_state. No run artifact records a seed,
      so Track B runs are not reproducible. Separately repro.get_git_sha has
      zero callers; the only git SHA reaching a run dir is
      finalize_manifest.json's, via a helper with no dirty-tree guard.
    tracking_doc: docs/FUNCTIONAL_COVERAGE.md
  - id: leaderboard-rows-not-traceable-to-runs
    severity: HIGH
    summary: >
      leaderboard.py:82-97 writes no run_ts, so a leaderboard row cannot be
      traced to the run directory that produced it -- only to an
      mlflow_run_id that is frequently null (MLflow logging is best-effort
      and exceptions are swallowed). get_leaders dedupes by candidate_id
      keeping max precision, so an older run can permanently mask a newer one.
    tracking_doc: docs/FUNCTIONAL_COVERAGE.md
  - id: session-levels-has-no-run-identity
    severity: HIGH
    summary: >
      src/features/session_profile.py:170-172 merges session_levels.parquet
      newest-build-wins with no run id, version or timestamp column. It is
      the cascade's structural SSOT and feeds build_move_matrix.py and
      build_target_matrix.py, so two Track C experiments run days apart can
      rest on different structural inputs undetectably. A concrete mechanism
      behind the cascade-population-shift finding.
    tracking_doc: docs/FUNCTIONAL_COVERAGE.md
  - id: track-c-outcome-datasets-lack-formal-version-identity
    severity: MEDIUM
    summary: >
      RESOLVED (tenth pass, 2026-09-22) the live half of this finding:
      eval_move_model.py/eval_target_model.py --dir are now required=True
      and build_target_matrix.py --move-dir fails clearly when unresolvable
      -- no consumer silently defaults to a stale version-suffixed dataset
      (move_matrix_v3, unsuffixed target_matrix) anymore. Downgraded from
      HIGH: the remaining gap is the ROOT CAUSE, not a live correctness
      risk -- sources/labels/'s Track C outcome datasets still carry no
      formal version identity beyond a directory-name suffix. The target
      mechanism is now fully designed AND implemented
      (docs/STORAGE_CONTRACT.md §17.1/§19, label_store.outcome_set_dir()/
      move_outcome_contract()/target_outcome_contract(),
      build_move_matrix.py/build_target_matrix.py --canonical-write) but not
      executed -- Track C's existing ~2G of move_matrix/target_matrix data
      has not been rebuilt or backfilled into the canonical
      <outcome_family>/<resolution>/<contract_id>/ layout.
    tracking_doc: docs/STORAGE_INVENTORY.md
  - id: serving-depends-on-webui
    severity: MEDIUM
    summary: >
      src/features/live_runtime.py:232,263,679, src/features/engine.py:359
      and src/execution/gateway.py:167-168 import from src.webui.live /
      regmodel, and the live signal contract (data/live/signals.jsonl) is
      produced by src/webui/live.py:1798-1890. Any reorganization treating
      src/webui as a presentation layer will break serving and execution.
    tracking_doc: docs/FUNCTIONAL_COVERAGE.md
  - id: cascade-population-shift
    severity: CRITICAL
    summary: "Track C's Stage-3-equivalent model's reported AUC changes are confounded with upstream gate-composition shift; no isolation tooling exists"
  - id: track-b-backtest-vs-paper-gap
    severity: CRITICAL
    summary: "Track B's one promoted model backtested at hit_rate=0.605/expectancy=26.9pt; realized paper trading delivered hit_rate=0.175/expectancy~1.0pt"
  - id: two-walk-forward-engines-incompatible-config
    severity: MEDIUM
    summary: >
      Two walk-forward engines coexist with incompatible config contracts.
      expanding_equal_count (src/search/controller.py::_build_folds) READS
      eval.walk_forward_folds as an input. expanding_calendar
      (src/validation/walk_forward.py::schedule_from_eval, ADR-042) never
      reads it -- it derives the schedule from eval.walk_forward.{train,test,val}
      and eval.date_range, and reports the resulting count as an OUTPUT.
      src/search/walk_forward_calendar.py no longer exists; that module moved
      to src/validation/walk_forward.py. The 2026-09 enumeration of 54
      folds.json was taken while those runs lived under data/research/custom_test
      (that directory is gone; the runs are under research/runs):
      n_folds is 3 in 38 runs, 6 in 12, 4 in 1, and 1 in 3 runs
      (nq-50pt-econ 2026-08-22). The three single-fold runs used
      expanding_calendar and therefore had NO walk-forward validation --
      one train/test split -- while their objective doc declared
      walk_forward_folds: 3. Not root-caused further.
    tracking_doc: docs/CONFIG_AUDIT.md
    supersedes_note: >
      Replaces a retracted finding ("nq-50pt-econ-walk-forward-folds-discrepancy")
      that claimed n_folds=1 in EVERY run (false: 3 of 54), and a subsequent
      over-correction claiming n_folds is NEVER 1 (also false). Only the full
      54-file enumeration recorded above is reliable.

