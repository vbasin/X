# Machine-readable pointer to canonical project truth.
# Generated/maintained by hand as part of ADR-136 (canonical research architecture).
# A fresh agent should be able to orient from this file + docs/ARCHITECTURE.md alone.
# This file describes STRUCTURE and STATUS. It is not itself an experiment artifact
# or a config source of truth — config.yaml / config/objectives/*.yaml remain that
# (see docs/CONFIG_AUDIT.md for what's actually consumed).

schema_version: 1
last_reviewed: "2026-09-22"
supersedes_note: >
  Re-derive this file's "implementations" section whenever a track's lifecycle
  status changes (e.g. a Track C promotion, a Track B fix). Do not let it drift
  silently out of sync with docs/ARCHITECTURE.md — that doc is the prose source
  of truth this file mirrors in machine-readable form.

canonical_docs:
  architecture: docs/ARCHITECTURE.md
  workflow: docs/RESEARCH_WORKFLOW.md
  experiments: docs/EXPERIMENTS.md
  data_contracts: docs/DATA_CONTRACTS.md
  config_audit: docs/CONFIG_AUDIT.md
  functional_coverage: docs/FUNCTIONAL_COVERAGE.md
  storage_contract: docs/STORAGE_CONTRACT.md
  storage_inventory: docs/STORAGE_INVENTORY.md
  environment: docs/ENVIRONMENT.md
  script_inventory: docs/SCRIPT_INVENTORY.md
  adr_index: docs/decisions/ADR_INDEX.md
  migration_manifest: docs/MIGRATION_MANIFEST.md
  agent_contract: docs/PUBLIC_SHOWCASE.md
  founding_adr: docs/decisions/ADR-136-canonical-research-architecture.md

canonical_cli: "python -m src.experiment.cli"
canonical_cli_subcommands: [status, validate-config, run-inspect, run-compare, verify]
# run-compare reports SETUP and RESULTS as separate sections (docs/EXPERIMENTS.md §3).


architecture_model: two_plane   # revised 2026-09-22 (third pass); see docs/ARCHITECTURE.md §1
planes:
  research: "what produces and validates a trading edge"
  platform: "what makes running the research plane possible at all"
  note: >
    The original ADR-136 twelve responsibilities were a decomposition of the
    RESEARCH PROBLEM, not of this repository. The bottom-up audit
    (docs/FUNCTIONAL_COVERAGE.md) found 4 further research-plane
    responsibilities and 8 platform-plane responsibilities with no owner.
    Entries below without an explicit `plane:` are research-plane and have a
    src/ subpackage; entries with `plane: platform` are durable
    capabilities that already exist in src/ and deliberately have NO canonical
    subpackage (creating one would be parallel abstraction for symmetry only).

responsibilities:
  # id: matches the subpackage under src/ and the section in docs/ARCHITECTURE.md
  - id: data_contracts
    status: PARTIAL_IMPLEMENTATION
    implementation_module: src/common/causal.py
    note: "causal.py is real/tested; raw schema + session/roll contracts are documented (docs/DATA_CONTRACTS.md), not yet code-enforced."
  - id: features
    status: INTERFACE_ONLY
    current_implementations:
      - {track: B, module: src/features/engine.py, status: ACTIVE}
      - {track: C, module: "src/training/entry_state.py, src/features/flow_state.py, src/features/structural_transitions.py", status: ACTIVE}
  - id: outcomes
    status: INTERFACE_ONLY
    current_implementations:
      - {track: B, module: src/training/labels.py, status: PRODUCTION_WIRED_WEAK}
      - {track: C, module: src/training/move_label.py, status: ACTIVE}
  - id: model_strategy
    status: INTERFACE_ONLY
    current_implementations:
      - {track: B, module: "src/models/catalog.py (xgboost, attention_lstm, tcn_close, tcn_so_mbp_vix, meta__xgboost, meta_stack__attention_lstm)", status: PRODUCTION_WIRED_WEAK}
      - {track: C, module: "scripts/features/eval_move_model.py, scripts/features/eval_target_model.py", status: ACTIVE}
  - id: validation
    status: ACTIVE
    implementation_module: src/validation/
    current_implementations:
      - {track: C, module: "src/validation/folds_from_objective, applied by eval_move_model.py and eval_target_model.py _fold_masks", status: ACTIVE}
      - {track: B, module: "src/validation/walk_forward.py expanding_calendar when requested; src/search/controller.py::_build_folds equal-count fallback", status: "ACTIVE — equal-count still ignores the calendar settings; see open_critical_findings/two-walk-forward-engines-incompatible-config"}
  - id: calibration
    status: NOT_IMPLEMENTED
    current_implementations: []
    note: "Confirmed absent from both tracks' live code paths. Net-new responsibility."
  - id: decision_policy
    status: INTERFACE_ONLY
    current_implementations:
      - {track: C, module: "scripts/features/build_target_matrix.py (p_move>=tau gate, resting/immediate entry)", status: ACTIVE}
  - id: economic_evaluation
    status: PARTIAL_IMPLEMENTATION
    implementation_module: src/evaluation/economic.py
    note: >
      economic.py is real/tested. Execution contract (fifth pass): MARKET/STOP
      at executable bid/ask (never midpoint; STOP price is a trigger), LIMIT
      at limit with no slippage; spread is NOT slippage (slippage = 0,
      persisted); quantity persisted; one all-in commission per completed
      trade from config/execution_costs.yaml (NQ $3.36, MNQ-equivalent $1.03
      independent, multiplier 0.1x NQ, priced off NQ data). t_stat_iid only;
      inference DEFERRED. Wired into portfolio_sim and into Track C's
      persisted book in eval_target_model.py (fill price in, barrier
      price out). Other paths still price on their own: _kpi.py,
      backtest/engine.py, cascade_backtest.py, paper, and external models.
    current_implementations:
      - {track: B, module: "src/backtest/portfolio_sim.py via src/evaluation/economic.py; src/evaluation/_kpi.py and src/backtest/engine.py still separate", status: PARTIAL}
      - {track: C, module: "scripts/features/eval_target_model.py persisted ledger via economic.py; src/backtest/cascade_backtest.py still separate", status: PARTIAL}
  - id: experiment
    status: PARTIAL_IMPLEMENTATION
    implementation_module: src/experiment/
    note: >
      manifest.py, config_validation.py, comparison.py, schemas.py are all
      real/tested. config_validation.py was integration-checked (read-only)
      against the real config.yaml and config/objectives/nq-50pt-econ.yaml
      in this repository and correctly reproduces the manually-audited dead
      fields / slippage bug (see tests/architecture/test_config_validation.py's
      two real-fixture tests). FIRST INTEGRATION DONE (fourth pass):
      src/search/controller.py now writes manifest.json alongside run.json
      via src/search/run_manifest.py -- purely additive, best-effort, no
      existing artifact or consumer touched. Manifests from that path report
      evidence_level: INCOMPLETE (no hypothesis, no seed recorded anywhere on
      the search path; config_snapshot is populated but never claimed
      resolved, since a multi-candidate sweep has no single run-level
      config) rather than fabricating the missing provenance.
      comparison.py/schemas.py remain unwired. Sixth pass: term is
      objective_id (manifest schema v2; v1 research_objective_id read and
      normalised); output contract = src/experiment/artifacts.py;
      objective identity vs defaults = x-objective-role in
      objective.schema.json. Cascade objective:
      config/objectives/nq-Rscaled-mkt.yaml (not wired).
      mnq-auction-firstpass.yaml is the superseded ADR-123/126
      candidate-exit objective. It previously copied cascade_policy
      literals; that was corrected. Market-entry cascade runs use
      nq-Rscaled-mkt. Objective runs write manifest.json (schema v4) as
      the only run-level file: passes, the resolved objective, and the
      fold design. run.json, contract.json, and folds.json stay readable
      for older runs. model.json holds that model's feature list and join
      spec. training_matrix.parquet is an optional pass-level population
      cache. OOF files do not store feature columns. Feature, context,
      and upstream-prediction joins are as-of on ts: a closed bar is
      visible at its close, and a session summary after that session
      closes. Labels may use the forward path. Fitted Track B
      custom_test runs were migrated into research/runs and
      data/research/custom_test is gone. evaluation/nq-50pt*,
      portfolio_sim, move_analysis, and context_analysis stay mapped in
      docs/new_file_map.md. A Track B model folder
      also keeps model.keras, model.pkl, meta.pkl, meta_estimator.pkl,
      and scaler.pkl. An Optuna HPO study is one objective run under
      research/runs/ (hpo.json and trials_summary.parquet beside
      manifest.json; one pass_n/model_<id>/ per trial). validation
      records the folds the study scored, not a forced last_range fold.
      The writer is scripts/search/hpo_model_search.py. research/search/
      is a separate compatibility root. New runs write research/runs/.
      Seventh
      pass: corrected the cascade's R definition (prior-5-session median, not
      current-session) and default economic sizing (MNQ_equivalent, not
      NQ); decision_grid_seconds/kpi.primary reclassified identity->default,
      new economic_intent field added; config_snapshot_resolved flag added
      (adapter always False); store_id-only datasets no longer satisfy
      version evidence; manifest.artifacts keys enforced canonical-only.
  - id: model_lifecycle
    status: INTERFACE_ONLY
    implementation_module: src/serving/lifecycle.py
    note: "status.py vocabulary is real/tested; registry logic still points at Track B's data/models/model_registry."
    current_implementations:
      - {track: B, module: "src/serving/promote.py, ADR-071 champion gate", status: PRODUCTION_WIRED}
  - id: serving
    status: INTERFACE_ONLY
    current_implementations:
      - {track: B, module: "src/serving/, src/paper/, src/execution/", status: "WIRED but paper trading inactive since 2026-08-05"}
  - id: orchestration
    status: INTERFACE_ONLY
    current_implementations:
      - {track: B, module: "src/research_director/, src/scoping/, scripts/search/", status: ACTIVE}

  # --- added by the third-pass bottom-up audit (docs/ARCHITECTURE.md §1.0) ---
  - id: dataset_registry
    status: EXISTING_IMPLEMENTATION_IS_CANONICAL
    note: "src/features/stores.py (~47 call sites, highest fan-in in repo) + src/training/label_store.py (content-addressed label_contract_id). REUSE AS CANONICAL — DatasetRef in manifest.py refers to it, does not replace it."
  - id: trade_definition
    status: EXISTING_IMPLEMENTATION_IS_CANONICAL
    note: "src/training/cascade_policy.py. Upstream of both Outcome Builder and Decision Policy."
  - id: population_eligibility
    status: NO_SINGLE_OWNER
    note: "src/training/path_labels.py::session_r/min_stop_ticks + cascade gate populations. Unowned; the mechanism behind cascade-population-shift."
  - id: cost_model
    status: NO_SINGLE_OWNER
    note: "src/training/cost_matrix.py puts costs in the TRAINING OBJECTIVE (:216,:368,:410), objective costs: blocks and EconomicAssumptions put them in post-hoc scoring. Cross-cutting; owning it inside economic_evaluation alone misses the path that changes what the model learns."
  - id: acquisition_ingestion
    plane: platform
    status: EXISTING_IMPLEMENTATION_IS_CANONICAL
    note: "src/acquisition/, src/ingestion/"
  - id: storage_sync
    plane: platform
    status: EXISTING_IMPLEMENTATION_IS_CANONICAL
    note: >
      src/common/data_paths.py (97 importers) is THE canonical logical-path resolver — extend
      it, never parallel it; src/common/object_store.py, src/gpu_runner/parquet_sync.py.
      Eighth pass (2026-09-22, docs/STORAGE_INVENTORY.md): full read-only re-inventory of the
      live /opt/vtech/data tree (111G) against actual producer/consumer code. Closed 3 resolver
      gaps (live/ signal bridge, session_profile/, research_director/regimes -- all additive,
      path-identical, 226 tests pass) and renamed the misleading "resolved_config" artifact
      class to config_snapshot. Confirmed, not fixed (each requires a behavior change or DB
      write out of this pass's scope): research/search/_fold_cache grew 14G->39G with no
      eviction; move_matrix/target_matrix consumer scripts default one generation behind their
      producer's current output (live correctness risk); the MLflow artifact store has an
      unresolved split-brain between ops/mlflow_artifacts and the pre-reorg top-level dir;
      Track C's outcome datasets still carry no version identity beyond a directory suffix.
      Top-level directory names (sources/research/models/evaluation/ops/legacy) are affirmed
      canonical; docs/architecture/DATA_LAYOUT.md §4's market/experiments/_legacy/ rename
      proposal was never adopted and is not revived.
      Ninth pass (2026-09-22, targeted correction): Track B's label_store.py was mislabeled
      content-addressed; it is CONTRACT-addressed (label_contract_id() hashes the semantic
      contract, never the parquet bytes; force=True can replace parts beneath an unchanged
      contract_id -- not content-immutable). Fixed a real false-provenance bug this caused:
      src/search/run_manifest.py had been surfacing a contract-metadata hash as
      DatasetRef.content_sha256; now always None on that path, with a new DatasetRef.build_id
      field (content > build > contract > store) honestly carrying realization identity
      instead. Designed (not executed) one canonical outcome-dataset pattern for Track B and
      Track C (docs/STORAGE_CONTRACT.md §17); resolved the live/ vs ops/ contradiction
      (ops/live/ is the target, live_dir() prefers it once populated, no files moved);
      reclassified the feature hive as conditionally reproducible, not a pure cache, since
      FeatureEngine reads TimescaleDB, not just sources/raw/. Migration matrix completed
      (docs/STORAGE_INVENTORY.md §3.1-3.7, was representative-only). 249 tests pass.
      Tenth pass (2026-09-22, Storage Implementation Tranche 1): finalized the exact
      canonical outcome-dataset syntax, replacing the ninth pass's overloaded single slot
      with two dimensions -- sources/labels/<outcome_family>/<resolution>/<contract_id>/
      (docs/STORAGE_CONTRACT.md §17.1-§20). Retired the ninth pass's build_id mechanism
      (a fingerprint of output filenames/sizes is not genuine build evidence); build_id is
      now populated only from real code/config/upstream evidence
      (label_store.write_build_sidecar, src.common.code_identity, new this pass) or left
      None. contract_id-only DatasetRefs now correctly count as missing evidence, not
      complete (RunManifest.missing_evidence); RunManifest.schema_version bumped 2->3 for
      this meaning change (v1/v2 still readable). Added DatasetRef.semantic_type =
      "predictions", distinct from outcomes. Reverted live_dir()'s auto-cutover to
      ops/live/ (ninth pass) -- it now always resolves to the current top-level live/ path;
      adopting ops/live/ requires an explicit future migration, not a filesystem probe.
      Fixed the live STOR-2 risk: eval_move_model.py/eval_target_model.py --dir and
      build_target_matrix.py --move-dir no longer silently default to a stale
      version-suffixed dataset, all three now fail clearly when unresolvable. Classified
      every build_move_matrix.py/build_target_matrix.py CLI field as semantic/
      build-population/execution-only (§19) and wired opt-in --canonical-write support on
      both builders (not executed -- no Track C data rebuilt).
      2026-09-23 (canonical run layout, audit remediation steps 1-8): the one migrated run
      on disk was non-conforming (legacy run.json trio, no manifest.json, per-model matrix
      path, model.json missing target/feature_columns/inputs, OOF still carrying feature
      columns). Fixed the writers and re-emitted it as nq-Rscaled-mkt/20260923T132829Z:
      manifest.json only, pass-level population caches, OOF 125->18 and 77->27 columns
      (362M->37M, 17.6M->5.3M), three dataset refs including the upstream OOF typed as
      predictions. build_oof_analysis.py rebuilds the full 125-column table from the compact
      OOF plus the cache. classify_existing() recognised NO model weight file (not even
      model.ubj) -- added a model_artifact class over .ubj/.keras/.pkl/meta*.pkl plus the
      serving-bundle and report files. Model identity moved out of the path resolver into
      src/experiment/model_identity.py, and the cascade's pass roles and feature
      views into src/training/cascade_run_spec.py, so run_layout.py holds no model-type or
      stage vocabulary (test-enforced). merge_pass() froze datasets after the first pass and
      silently dropped pass 2's dataset identity -- now re-derived and unioned, with
      RunManifest.write accepting an additive dataset change while still refusing a changed
      or dropped ref. Path primitives (prepare_path/session_grid/parse_hhmm) extracted from
      portfolio_sim to src/features/session_path.py -- they were imported as PRIVATE names by
      six modules. EconomicAssumptions gained optional per-leg slippage and
      SimConfig.as_assumptions()/from_assumptions() are the whole economic bridge; the sim's
      $5.00 round trip is NOT silently replaced by the $3.36 NQ profile. read_run_record() now
      reads Track B search/custom_test runs too (one reader, three run shapes; WebUI still
      lists 185 runs). EvalContract.from_manifest()/load_latest(run_dir=...) sequence the
      hold-out-pin handover and RAISE on disagreement rather than ranking two sources of
      truth; the four pinned nq-50pt* objectives resolve exactly as before. 377 tests pass,
      with zero new failures against a stashed baseline (36 pre-existing failures unchanged).
      2026-09-23 (Track B joins the canonical architecture, steps 1-5): migrated the
      representative complex Track B run nq-50pt-econ-lg-st/20260829T182514Z (3 base models
      on 3 native timeframes, Keras + 2 pickled XGBoost, tf_oof_meta pass 2, scalers,
      serving files, multi-class SHAP) into research/runs/, proving the canonical layout
      supports Track B as cleanly as Track C. Extracted the core to
      src/search/canonical_run.py::emit_canonical_run and wired src/search/controller.py to
      call it when a search run finishes, so FUTURE Track B runs write the canonical layout
      directly instead of relying on post-hoc copying; weight files are hard-linked, so the
      canonical tree costs no extra storage. Closed the manifest evidence gaps where the
      evidence genuinely exists: merge_pass now accepts seeds/execution_assumptions/code/
      extra, and new economic.assumptions_record() is the single builder for a run's cost
      record (resolves the objective's execution_cost_profile, refuses to read an unparsed
      slippage_model as zero, and records declared_not_applied when a run applied a cost its
      objective did not declare -- which surfaced the ADR-136 dead slippage_model finding per
      run). Fixed a real provenance error: merge_pass stamped every manifest with the CURRENT
      commit, so a migrated historical run claimed code it never saw; emit_canonical_run now
      reads the run's own recorded git_sha and refuses a run-level identity when the fits
      disagree. Nothing fabricated for historical runs -- absent seeds/config_snapshot/build
      identity are reported in missing_evidence with the reason in extra.evidence. Finished
      the economic consolidation: portfolio_sim.trade_ledger()/cost_sensitivity() route
      through canonical/evaluation/economic.py, with an explicit comparison test proving the
      canonical ledger equals the simulator's own net_usd per trade and in aggregate.
      Retired no legacy artifact: tests/architecture/test_legacy_retirement_gate.py pins that
      each of run.json/search_result.json/folds.json/feature_schema.json/
      finalize_manifest.json/compose.json still has a real consumer AND a canonical
      replacement. Track C run 20260923T143018Z carries the complete evidence record. A second
      Track B run (nq-50pt-tbm/20260821T072412Z) exercised the case where a historical
      candidate_id IS its own model type ('xgboost'): the folder falls back to the
      configuration hash and source_candidate_id keeps the old pointer resolvable.
      404 tests pass, zero new failures against the 36-failure pre-existing baseline.
  - id: compute_resources
    plane: platform
    status: EXISTING_IMPLEMENTATION_IS_CANONICAL
    note: "src/common/{vm_config,gpu_provider,gpu_exec,oci_queue}.py, src/gpu_runner/"
  - id: job_orchestration_state
