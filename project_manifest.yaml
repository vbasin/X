    note: "src/webui/ (~62 endpoints, 11,930 LOC). NOT a presentation layer — serving/execution import from it (see open_critical_findings/serving-depends-on-webui)."
  - id: research_automation
    plane: platform
    status: EXISTING_IMPLEMENTATION_IS_CANONICAL
    note: >
      src/research_director/, src/scoping/, src/agentic/, src/common/llm/
      (43 files, ~7,100 LOC). CAVEAT (adversarial review, third pass):
      src/research_director/evaluator.py is bucketed here by DIRECTORY,
      but its content -- bootstrap 95% CI on the aggregate fold delta,
      guardrail non-regression, improvement on >= ceil(2/3) of folds
      (:19-21) -- is a Validator / Model Lifecycle concern and is
      stricter than anything in src/validation. This is
      classification-by-directory, the same anti-pattern flagged for
      entry_state.py and path_features.py. Reassign when evaluator.py is
      next touched; not moved in this pass.

