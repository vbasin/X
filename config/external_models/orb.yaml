# Opening Range Breakout for /NQ (ADR-118).
#
# Self-contained engine: unlike psar / ema20 / zigzag this card does NOT
# feed the shared book. Position sizing, the drawdown floor, scale-outs and
# the daily loss limit are account-level state that simulate_book does not
# model, so the ORB engine owns its own simulator and its own session /
# risk / exit knobs. It therefore runs standalone, not inside a stack.
id: orb
title: Opening Range Breakout (/NQ)
kind: rule_engine
engine: orb
listed: true
standalone: true
stage: 0
timeframe: 1min
candle_table: databento.tbbo_1min
symbol_root: NQ
description: >
  Trades the /NQ regular-session opening range three ways: continuation
  breakouts through the range extreme, failed-breakout reversals that fade
  trapped entrants, and inside-range rotations on balanced sessions. Entries
  are gated on abnormal opening participation (relative volume) plus a
  range-quality band measured against daily ATR — the filters the ORB
  literature finds carry the edge. Risk is contract-sized from the stop
  distance so every trade risks a fixed dollar amount, with partial profit at
  T1, a breakeven runner, a daily loss limit, and a hard equity floor that
  halts trading permanently if touched.
params:
  or_minutes: 15
  session_start: "08:30"
  trade_end: "13:00"
  session_end: "14:45"
  va_pct: 0.70
  min_rvol: 1.3
  rvol_lookback: 14
  min_or_atr: 0.20
  max_or_atr: 1.30
  atr_days: 14
  setups: "breakout_retest"
  entry_start: "08:45"
  min_poke_atr: 0.02
  rejection_clv: 0.65
  retest_band_frac: 0.10
  break_buffer_ticks: 4.0
  fade_band_frac: 0.15
  fade_max_or_atr: 0.80
  max_trades_per_day: 2
  t1_r: 1.0
  t2_r: 2.0
  scale_out_pct: 0.5
  breakeven_after_t1: true
  be_offset_pts: 1.0
  trail_pts: 0.0
  max_stop_points: 50.0
  initial_balance: 5000.0
  point_value: 20.0
  max_drawdown: 1000.0
  risk_usd_per_trade: 200.0
  max_contracts: 3
  margin_per_contract: 1000.0
  daily_loss_limit: 300.0
  headroom_frac: 0.5
  cost_per_trade: 0.0
  slippage_points: 0.25
