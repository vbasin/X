name: Public showcase
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, publication/platform-showcase, showcase/transformer-robin]
jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-demo.lock
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src/demo.py tests/test_public_demo.py --select E9,F63,F7,F82,F401
      - run: make test-publication
      - run: vtech-demo --output .demo-output/ci
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-showcase
          path: .demo-output/ci/
          retention-days: 7

  transformer-showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-showcase.lock
      - run: python -m pip install -r requirements-showcase.lock
      - run: python -m pip install -e ".[dev]" playwright==1.64.0
      - run: python -m playwright install --with-deps chromium
      - run: make test-showcase
      - run: python -m src.showcase prepare --output .demo-output/robin
      - name: Browser acceptance
        run: |
          python -m src.showcase serve --output .demo-output/robin --port 8870 --mlflow-port 5500 > .demo-output/server.log 2>&1 &
          SHOWCASE_PID=$!
          trap 'kill -TERM "$SHOWCASE_PID" 2>/dev/null || true; wait "$SHOWCASE_PID" || true' EXIT
          python scripts/showcase/check_browser.py --url http://127.0.0.1:8870 --mlflow-url http://127.0.0.1:5500 --output .demo-output/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transformer-showcase-evidence
          path: .demo-output/
          retention-days: 7
  transformer-rerun:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-transformer.lock
      - run: python -m pip install -r requirements-transformer.lock
      - run: python -m pip install -e ".[dev]"
      - run: make test-ml-workflow
      - run: python -m src.experiment.transformer_workflow --objective config/workflows/synthetic_regime_objective.json --data-root "$PWD/.demo-output/robin-rerun"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transformer-rerun-evidence
          path: .demo-output/robin-rerun/
          retention-days: 7
